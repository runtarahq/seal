[package]
name = "seal-sealer"
description = "Seals a secret to a seal keyset outside a browser. It cannot open one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# Without `open`: this binary has no code that could open a value. Build it with
# `--package seal-sealer`, since a build of the whole workspace compiles one
# `seal-format` for every crate, with the service's features.
seal-format.workspace = true
zeroize = "1"

[dev-dependencies]
seal-format = { workspace = true, features = ["open"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
