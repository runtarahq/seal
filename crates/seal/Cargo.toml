[package]
name = "seal"
description = "The seal credential broker service and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
nix = { version = "0.31", features = ["mman", "process", "resource", "user"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
seal-broker.workspace = true
seal-format.workspace = true
seal-keys.workspace = true
seal-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"

[dev-dependencies]
async-trait = "0.1"
base64 = "0.23"
form_urlencoded = "1"
ring = "0.17"
futures-util = "0.3"
seal-client = { workspace = true, features = ["in-process", "postgres"] }
seal-testkit = { path = "../seal-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[lints]
workspace = true
