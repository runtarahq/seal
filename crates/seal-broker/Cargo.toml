[package]
name = "seal-broker"
description = "Policy matching, injection, signing, the HTTP client and the Postgres relay for seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
form_urlencoded = "1"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
seal-format = { workspace = true, features = ["open"] }
seal-keys.workspace = true
# `raw_value` keeps the parts of a body seal does not change as they were written. Not
# `arbitrary_precision`: Cargo would turn that on for every crate an embedding
# application builds, and change how all of them read and write numbers.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"
zeroize = "1"
quick-xml = { version = "0.42", default-features = false }
postgres-protocol = "0.6"

[dev-dependencies]
base64 = "0.23"
seal-testkit = { path = "../seal-testkit" }
futures-core = "0.3"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tracing = "0.1"
# Only to cross-check seal's own SigV4 against the AWS SDK's.
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1", default-features = false }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[lints]
workspace = true
