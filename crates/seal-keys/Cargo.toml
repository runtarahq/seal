[package]
name = "seal-keys"
description = "Keyring, key sources and key wrapping for seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Wrapping with a key in AWS KMS, with the AWS SDK. Off by default, so that a build
# without it links none of the SDK.
aws-kms = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-kms",
    "dep:aws-smithy-http-client",
    "dep:webpki-root-certs",
]

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-credential-types = { version = "1", optional = true, default-features = false }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", optional = true, default-features = false, features = ["rustls-ring"] }
base64 = "0.23"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
metrics = "0.24"
percent-encoding = "2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The keyring holds private keys, so this crate is on the opening side.
seal-format = { workspace = true, features = ["open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt", "sync", "time"] }
tracing = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
# The same roots as certificates, which is the form the AWS SDK's HTTP client takes.
webpki-root-certs = { version = "1", optional = true }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
futures-util = "0.3"
seal-testkit = { path = "../seal-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
