[package]
name = "seal-keys"
description = "Keyring, key sources and key wrapping for seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
metrics = "0.24"
percent-encoding = "2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The keyring holds private keys, so this crate is on the opening side.
seal-format = { workspace = true, features = ["open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt", "sync", "time"] }
tracing = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
# Only to check seal's signature of a KMS request against the AWS SDK's.
aws-credential-types = { version = "1", default-features = false }
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
futures-util = "0.3"
seal-testkit = { path = "../seal-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
