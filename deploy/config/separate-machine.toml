# seal on its own machine, over TCP with mutual TLS. Callers are identified by their
# certificate's subject. See docs/operations.md.

[listen]
tcp = "0.0.0.0:7443"
tls = { cert = "/etc/seal/tls.crt", key = "/etc/seal/tls.key", client_ca = "/etc/seal/clients-ca.crt" }
reload_interval = "10s"                 # certificates are short-lived and renewed outside seal

[[callers]]
name = "runtara-server"
cert_subject = "CN=runtara-server,O=Example"
keysets = ["*"]

[[callers]]
name = "operator"
cert_subject = "CN=operator,O=Example"
keysets = []
admin = true

[keys]
# Several instances on separate machines share the wrapped keys in a bucket, and a
# wrapping key that stays in a KMS.
source = { s3 = { endpoint = "https://s3.gra.io.cloud.ovh.net", region = "gra", bucket = "example-seal-keys", prefix = "keys/", credentials_file = "/etc/seal/s3-credentials" } }
wrap = { ovh_kms = { endpoint = "https://eu-west-rbx.okms.ovh.net", okms_id = "11111111-2222-3333-4444-555555555555", key_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", cert = "/etc/seal/kms.crt", key = "/etc/seal/kms.key" } }
lock_memory = "required"

[limits]
max_concurrent_streams = 512
memory_budget = "2GiB"

[audit]
sink = "stdout"
on_failure = "fail_closed"

[metrics]
listen = "127.0.0.1:9464"
