# seal on its own machine, over TCP with mutual TLS. Callers are identified by their
# certificate's subject. See docs/operations.md.

[listen]
tcp = "0.0.0.0:7443"
tls = { cert = "/etc/seal/tls.crt", key = "/etc/seal/tls.key", client_ca = "/etc/seal/clients-ca.crt" }
reload_interval = "10s"                 # certificates are short-lived and renewed outside seal

[[callers]]
name = "runtara-server"
cert_subject = "CN=runtara-server,O=Example"
keysets = ["*"]

[[callers]]
name = "operator"
cert_subject = "CN=operator,O=Example"
keysets = []
admin = true

[keys]
source = { http = { url = "https://keys.internal.example/v1", ca = "/etc/seal/keys-ca.crt", cert = "/etc/seal/keys-client.crt", key = "/etc/seal/keys-client.key" } }
wrap = { file = "/etc/seal/kek" }
lock_memory = "required"

[limits]
max_concurrent_streams = 512
memory_budget = "2GiB"

[audit]
sink = "stdout"
on_failure = "fail_closed"

[metrics]
listen = "127.0.0.1:9464"
