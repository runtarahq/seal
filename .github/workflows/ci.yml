name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --workspace --locked

  # What is released: a static binary, linked against musl.
  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: cargo test --workspace --locked --target x86_64-unknown-linux-musl
      - name: The release binary is static
        run: |
          cargo build --release --locked --package seal --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/seal | tee /dev/stderr | grep -q "static-pie linked"

  # The container image, started by the same tests in place of the binary they built, on
  # each architecture it is published for.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: |
          docker build -f deploy/container/Dockerfile -t seal \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: The image is for this architecture
        run: test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' seal)" = "linux/$ARCH"
      - name: The image holds the binary and nothing else
        run: |
          container=$(docker create seal)
          files=$(docker export "$container" | tar t | grep -v '/$' | grep -v -E '^(\.dockerenv|dev/|etc/(hostname|hosts|mtab|resolv\.conf)$)')
          docker rm "$container" > /dev/null
          echo "$files"
          test "$files" = "usr/local/bin/seal"
      - name: The service tests pass against the image
        run: |
          SEAL_TEST_BIN="$PWD/scripts/seal-in-container.sh" \
            cargo test --package seal --test modes --test oauth --test service --locked
      # Kept for the publish job, which pushes the image that was tested, not a rebuild.
      - name: Save the image
        if: github.event_name == 'push'
        run: docker tag seal "seal:$ARCH" && docker save --output "seal-$ARCH.tar" "seal:$ARCH"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: seal-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  # RustFS, Azurite and Postgres 14 to 18, with images pinned by digest in seal-testkit.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal --test containers --locked -- --ignored
      - run: cargo test --package seal --test postgres --locked -- --ignored

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal-format --package seal-client --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-audit
      # The workspace, and the fuzzing workspace, which has its own lockfile.
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo doc --workspace --no-deps --all-features --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo check --package seal-format --features wasm --target wasm32-unknown-unknown --locked
      - name: Install the wasm-bindgen version in Cargo.lock
        run: |
          version="$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Test inside WebAssembly
        run: cargo test --package seal-format --features wasm --target wasm32-unknown-unknown --test wasm --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Seal in WebAssembly and open natively
        run: scripts/wasm-roundtrip.sh

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the vectors with an independent implementation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install cryptography==50.0.2
          .venv/bin/python -I vectors/verify.py

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_parse
          - policy_parse
          - url_match
          - address_classify
          - form_inject
          - json_inject
          - response_seal_json
          - response_seal_form
          - response_seal_xml
          - pg_preamble
          - pg_auth_messages
          - proto_send_head
          - jwt_claims
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- -max_total_time=60
        env:
          TARGET: ${{ matrix.target }}

  # Publishes the tested images to ghcr.io once every other job has passed. A push to
  # main moves `main`; a tag `v1.2.3` publishes `1.2.3` and moves `latest`. Every
  # publication also has a tag naming its commit, which never moves.
  publish:
    if: github.event_name == 'push'
    needs:
      - fmt
      - clippy
      - test-linux
      - test-musl
      - image
      - containers
      - test-macos
      - deny
      - audit
      - doc
      - wasm
      - vectors
      - fuzz-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the tags
        run: |
          tags="sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            # The tag names the version the binary reports.
            grep -q -x -F "version = \"$version\"" Cargo.toml
            tags="$tags $version"
            # A pre-release, such as 1.2.3-rc.1, does not become `latest`.
            case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          else
            tags="$tags $GITHUB_REF_NAME"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One image per architecture, then an index over both under each tag.
      - name: Push
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            docker load --input "seal-$arch.tar"
            docker tag "seal:$arch" "$image:sha-$GITHUB_SHA-$arch"
            docker push "$image:sha-$GITHUB_SHA-$arch"
          done
          set --
          for tag in $TAGS; do set -- "$@" --tag "$image:$tag"; done
          docker buildx imagetools create "$@" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
