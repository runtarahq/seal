name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Tools installed here are named by version, so that a run uses what the last one did:
# a new release of one, good or bad, arrives by a change to this file.
env:
  NIGHTLY: nightly-2026-11-09
  CARGO_AUDIT: 0.22.2
  CARGO_FUZZ: 0.13.2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --workspace --locked
      # Off by default, so the run above builds and tests seal without it.
      - name: With AWS KMS
        run: cargo test --package seal-keys --package seal --features aws-kms --locked

  # What is released: a static binary, linked against musl.
  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: cargo test --workspace --locked --target x86_64-unknown-linux-musl
      - name: The release binary is static
        run: |
          cargo build --release --locked --package seal --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/seal | tee /dev/stderr | grep -q "static-pie linked"
      - name: And is static with AWS KMS
        run: |
          cargo build --release --locked --package seal --features aws-kms --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/seal | tee /dev/stderr | grep -q "static-pie linked"

  # The program that seals outside a browser, as it is released: static, for each
  # architecture, and built by itself, so that it is compiled without the opening code
  # the service has.
  sealer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    # The SHA-256 of the binary each architecture saved, which the release job holds
    # what it downloads to.
    outputs:
      amd64: ${{ steps.save.outputs.amd64 }}
      arm64: ${{ steps.save.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo test --package seal-sealer --locked --target "$TARGET"
      - name: The sealer is static, and has no opening code
        run: |
          cargo build --release --locked --package seal-sealer --target "$TARGET"
          # Position-independent on amd64 and not on arm64, which is the target's own
          # default; static on both.
          file "target/$TARGET/release/seal-sealer" | tee /dev/stderr | grep -q -E "static-pie linked|statically linked"
          ! cargo tree --locked --package seal-sealer --edges features,no-dev | grep -F 'seal-format feature "open"'
      - name: Save the binary
        id: save
        run: |
          cp "target/$TARGET/release/seal-sealer" "seal-sealer-linux-$ARCH"
          echo "$ARCH=$(sha256sum "seal-sealer-linux-$ARCH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealer-${{ matrix.arch }}
          path: seal-sealer-linux-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # The container image, started by the same tests in place of the binary they built, on
  # each architecture it is published for.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    # The SHA-256 of the image each architecture saved. An artifact can be written by
    # any job of a run, so the publish job pushes only a file with this digest.
    outputs:
      amd64: ${{ steps.save.outputs.amd64 }}
      arm64: ${{ steps.save.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: |
          docker build -f deploy/container/Dockerfile -t seal \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: The image is for this architecture
        run: test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' seal)" = "linux/$ARCH"
      - name: The image holds the binary and nothing else
        run: |
          container=$(docker create seal)
          files=$(docker export "$container" | tar t | grep -v '/$' | grep -v -E '^(\.dockerenv|dev/|etc/(hostname|hosts|mtab|resolv\.conf)$)')
          docker rm "$container" > /dev/null
          echo "$files"
          test "$files" = "usr/local/bin/seal"
      # Kept for the publish job, which pushes the image that was tested, not a rebuild.
      # Saved and its digest taken before the tests, whose own dependencies run beside
      # the image and could otherwise change what is saved.
      - name: Save the image
        id: save
        run: |
          docker tag seal "seal:$ARCH"
          docker save --output "seal-$ARCH.tar" "seal:$ARCH"
          echo "$ARCH=$(sha256sum "seal-$ARCH.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: seal-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error
      - name: The service tests pass against the image
        run: |
          SEAL_TEST_BIN="$PWD/scripts/seal-in-container.sh" \
            cargo test --package seal --features aws-kms --test modes --test oauth --test service --locked

  # RustFS, Azurite and Postgres 14 to 18, with images pinned by digest in seal-testkit.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal --test containers --locked -- --ignored
      - run: cargo test --package seal --test postgres --locked -- --ignored
      - run: cargo test --package seal-keys --lib --locked s3::tests -- --ignored

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal-format --package seal-client --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-audit --version "$CARGO_AUDIT"
      # The workspace, and the fuzzing workspace, which has its own lockfile.
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo doc --workspace --no-deps --all-features --locked

  wasm:
    runs-on: ubuntu-latest
    # The SHA-256 of the archive saved here, which the release job holds what it
    # downloads to.
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo check --package seal-format --features wasm --target wasm32-unknown-unknown --locked
      - name: Install the wasm-bindgen version in Cargo.lock
        run: |
          version="$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Test inside WebAssembly
        run: cargo test --package seal-format --features wasm --target wasm32-unknown-unknown --test wasm --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Seal in WebAssembly, open natively, and admit an intake envelope
        run: scripts/wasm-roundtrip.sh
      # The sealer as a page or a bundler takes it. The script loads the module it
      # packs and opens what that seals, so what is released is what was checked.
      - name: Pack the module as it is released
        id: pack
        run: |
          scripts/package-wasm.sh seal-wasm.tar.gz
          echo "archive=$(sha256sum seal-wasm.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: seal-wasm.tar.gz
          retention-days: 1
          if-no-files-found: error

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the vectors with an independent implementation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary :all: -r vectors/requirements.txt
          .venv/bin/python -I vectors/verify.py

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_parse
          - policy_parse
          - url_match
          - address_classify
          - form_inject
          - json_inject
          - response_seal_json
          - response_seal_form
          - response_seal_xml
          - pg_preamble
          - pg_auth_messages
          - proto_send_head
          - jwt_claims
          - intake_object
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo "+$NIGHTLY" install --locked cargo-fuzz --version "$CARGO_FUZZ"
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo "+$NIGHTLY" fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- -max_total_time=60
        env:
          TARGET: ${{ matrix.target }}

  # Publishes the tested images to ghcr.io once every other job has passed. A push to
  # main moves `main`; a tag `v1.2.3` publishes `1.2.3` and moves `latest`. Every
  # publication also has a tag naming its commit, which never moves, and a signed
  # statement of where it was built, which `gh attestation verify` checks.
  publish:
    if: github.event_name == 'push'
    needs:
      - fmt
      - clippy
      - test-linux
      - test-musl
      - sealer
      - image
      - containers
      - test-macos
      - deny
      - audit
      - doc
      - wasm
      - vectors
      - fuzz-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # To sign the statement of where the image was built, and store it.
      id-token: write
      attestations: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the tags
        run: |
          tags="sha-$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            # The tag names the version the binary reports.
            grep -q -x -F "version = \"$version\"" Cargo.toml
            tags="$tags $version"
            # A pre-release, such as 1.2.3-rc.1, does not become `latest`.
            case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          else
            tags="$tags $GITHUB_REF_NAME"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      # Each by its own name, and nothing else a job of this run may have uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-arm64
      - name: The images are the ones that were tested
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          printf '%s  seal-amd64.tar\n%s  seal-arm64.tar\n' "$AMD64" "$ARM64" | sha256sum --check --strict
        env:
          AMD64: ${{ needs.image.outputs.amd64 }}
          ARM64: ${{ needs.image.outputs.arm64 }}
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One image per architecture, then an index over both under each tag.
      - name: Push
        id: push
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            docker load --input "seal-$arch.tar"
            docker tag "seal:$arch" "$image:sha-$GITHUB_SHA-$arch"
            docker push "$image:sha-$GITHUB_SHA-$arch"
          done
          set --
          for tag in $TAGS; do set -- "$@" --tag "$image:$tag"; done
          docker buildx imagetools create "$@" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Says that this workflow built the image from this commit, signed with the
      # run's own identity, and kept beside the image in the registry.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # On a tag, a GitHub release with what an application needs besides the image: the
  # WebAssembly sealer it serves, and `seal-sealer` for scripts. Only once the image of
  # the same commit is published, only the files the jobs above saved and checked, and
  # each with a signed statement of where it was built, which
  # `gh attestation verify <file> --repo runtarahq/seal` checks.
  release:
    if: github.ref_type == 'tag'
    needs:
      - publish
      - sealer
      - wasm
    runs-on: ubuntu-latest
    permissions:
      # To create the release.
      contents: write
      # To sign the statements of where the files were built, and store them.
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each by its own name, and nothing else a job of this run may have uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sealer-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sealer-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
      - name: The files are the ones that were checked
        run: |
          test -n "$AMD64" && test -n "$ARM64" && test -n "$WASM"
          printf '%s  %s\n' \
            "$AMD64" seal-sealer-linux-amd64 \
            "$ARM64" seal-sealer-linux-arm64 \
            "$WASM" seal-wasm.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
        env:
          AMD64: ${{ needs.sealer.outputs.amd64 }}
          ARM64: ${{ needs.sealer.outputs.arm64 }}
          WASM: ${{ needs.wasm.outputs.archive }}
      - name: Take the release's notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes() {
            awk -v heading="## [$1]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }
          notes "$version" > notes.md
          # A pre-release is of what is not released yet.
          case "$version" in
            *-*) grep -q '[^[:space:]]' notes.md || notes Unreleased > notes.md ;;
          esac
          # A release that the changelog says nothing of is a mistake in one of them.
          grep -q '[^[:space:]]' notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            seal-sealer-linux-amd64
            seal-sealer-linux-arm64
            seal-wasm.tar.gz
      - name: Create the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A pre-release, such as 1.2.3-rc.1, does not become the latest release.
          case "$version" in *-*) set -- --prerelease ;; *) set -- ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" \
            --notes-file notes.md "$@" \
            seal-sealer-linux-amd64 seal-sealer-linux-arm64 seal-wasm.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
