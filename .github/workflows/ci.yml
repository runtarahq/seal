name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --workspace --locked

  # RustFS, Azurite and Postgres 14 to 18, with images pinned by digest in seal-testkit.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal --test containers --locked -- --ignored
      - run: cargo test --package seal --test postgres --locked -- --ignored

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --package seal-format --package seal-client --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-audit
      # The workspace, and the fuzzing workspace, which has its own lockfile.
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo doc --workspace --no-deps --all-features --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo check --package seal-format --features wasm --target wasm32-unknown-unknown --locked
      - name: Install the wasm-bindgen version in Cargo.lock
        run: |
          version="$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Test inside WebAssembly
        run: cargo test --package seal-format --features wasm --target wasm32-unknown-unknown --test wasm --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Seal in WebAssembly and open natively
        run: scripts/wasm-roundtrip.sh

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the vectors with an independent implementation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install cryptography==50.0.2
          .venv/bin/python -I vectors/verify.py

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_parse
          - policy_parse
          - url_match
          - address_classify
          - form_inject
          - json_inject
          - response_seal_json
          - response_seal_form
          - response_seal_xml
          - pg_preamble
          - pg_auth_messages
          - proto_send_head
          - jwt_claims
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- -max_total_time=60
        env:
          TARGET: ${{ matrix.target }}
