name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      github_oauth:
        description: Also run the GitHub OAuth test, which uses up its refresh token
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Transfer 5 GB under a memory limit
        run: cargo test --release --package seal-broker --test memory --locked -- --ignored --test-threads=1
      - name: Measure the memory ceiling's cost constants
        run: cargo test --release --package seal --test memory --locked -- --ignored --test-threads=1

  real-providers:
    # Secrets are never given to forks, and this never runs for one.
    if: github.repository == 'runtarahq/seal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Google service account
        run: cargo test --package seal --test real_providers --locked -- --ignored google
        env:
          SEAL_TEST_GOOGLE_SA_JSON: ${{ secrets.SEAL_TEST_GOOGLE_SA_JSON }}
      - name: GitHub OAuth app
        if: inputs.github_oauth
        run: cargo test --package seal --test real_providers --locked -- --ignored github
        env:
          SEAL_TEST_GITHUB_CLIENT_ID: ${{ secrets.SEAL_TEST_GITHUB_CLIENT_ID }}
          SEAL_TEST_GITHUB_CLIENT_SECRET: ${{ secrets.SEAL_TEST_GITHUB_CLIENT_SECRET }}
          SEAL_TEST_GITHUB_REFRESH_TOKEN: ${{ secrets.SEAL_TEST_GITHUB_REFRESH_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-audit
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_parse
          - policy_parse
          - url_match
          - address_classify
          - form_inject
          - json_inject
          - response_seal_json
          - response_seal_form
          - response_seal_xml
          - pg_preamble
          - pg_auth_messages
          - proto_send_head
          - jwt_claims
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked cargo-fuzz
      # Each night starts from the corpus the night before grew. A cache entry cannot
      # be overwritten, so each run saves under its own key and the next restores the
      # newest by prefix.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for an hour
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- -max_total_time=3600
        env:
          TARGET: ${{ matrix.target }}
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # The input that failed, to reproduce with `cargo fuzz run <target> <file>`.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
